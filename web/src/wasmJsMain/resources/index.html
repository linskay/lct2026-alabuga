<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Арена B2B-переговоров | ОЭЗ «Алабуга» — 3D Б.А.Р.С. & Майк</title>
    <link rel="icon" type="image/svg+xml" href="alabuga-logo.svg">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }
        *:focus, *:focus-visible {
            outline: none !important;
            box-shadow: none !important;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #06070B;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #bars-3d-model-viewer,
        #bars-3d-model-viewer *,
        model-viewer,
        model-viewer * {
            outline: none !important;
            border: none !important;
            box-shadow: none !important;
            -webkit-tap-highlight-color: transparent !important;
            user-select: none !important;
            -webkit-user-select: none !important;
        }
        #bars-3d-model-viewer,
        model-viewer {
            position: absolute;
            z-index: 50;
            background-color: transparent !important;
            --poster-color: transparent !important;
            pointer-events: auto;
            display: none;
            outline: none !important;
            border: none !important;
            box-shadow: none !important;
        }
        #bars-3d-model-viewer:focus,
        #bars-3d-model-viewer:focus-visible,
        #bars-3d-model-viewer:focus-within,
        #bars-3d-model-viewer:active,
        model-viewer:focus,
        model-viewer:focus-visible,
        model-viewer:focus-within,
        model-viewer:active {
            outline: none !important;
            border: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>
    <model-viewer id="bars-3d-model-viewer"
                  src="bars.glb"
                  alt="3D робот-наставник Б.А.Р.С."
                  tabindex="-1"
                  autoplay
                  animation-name="Wave"
                  camera-controls
                  disable-zoom
                  interaction-prompt="none"
                  touch-action="pan-y"
                  camera-orbit="0deg 75deg 110%"
                  camera-target="0m 1.05m 0m"
                  shadow-intensity="1.5"
                  shadow-softness="0.75"
                  exposure="1.2"
                  environment-image="neutral">
        <div slot="progress-bar" style="display: none;"></div>
    </model-viewer>

    <script>
        const BARS_ANIM_MAP = {
            'wave': 'Wave',
            'idle': 'Wave',
            'talk': 'Wave',
            'nod': 'Yes',
            'tilt': 'Sitting',
            'warn': 'No',
            'win': 'ThumbsUp',
            'punch': 'Punch',
            'jump': 'Jump',
            'bluff': 'Punch',
            'death': 'Death'
        };

        const MIKE_ANIM_MAP = {
            'wave': 'SK_ZMikeAnim_ZMIKE_WaveLoop',
            'idle': 'SK_ZMikeAnim_ZMIKE_WaveLoop',
            'talk': 'SK_ZMikeAnim_ZMIKE_IdleBreaker',
            'nod': 'SK_ZMikeAnim_ZMIKE_ExitWave',
            'tilt': 'SK_ZMikeAnim_ZMIKE_Blinking',
            'bluff': 'SK_ZMikeAnim_ZMIKE_IdleAggro',
            'jump': 'SK_ZMikeAnim_ZMIKE_Jump',
            'win': 'SK_ZMikeAnim_ZMIKE_WaveLoop',
            'punch': 'SK_ZMikeAnim_ZMIKE_PunchR',
            'warn': 'SK_ZMikeAnim_ZMIKE_IdleAggro'
        };

        function resolveAnimation(animName) {
            const mv = document.getElementById('bars-3d-model-viewer');
            const available = (mv && mv.availableAnimations) ? mv.availableAnimations : [];
            const isMike = available.some(function(a) { return a.indexOf('SK_ZMike') !== -1; });
            if (!animName) return isMike ? 'SK_ZMikeAnim_ZMIKE_WaveLoop' : 'Wave';
            const key = animName.toLowerCase();
            if (isMike) {
                if (MIKE_ANIM_MAP[key]) return MIKE_ANIM_MAP[key];
            } else {
                if (BARS_ANIM_MAP[key]) return BARS_ANIM_MAP[key];
            }
            return animName;
        }

        function sanitizeModelViewer(mv) {
            if (!mv) return;
            try {
                mv.style.outline = 'none';
                mv.style.border = 'none';
                mv.style.boxShadow = 'none';
                mv.tabIndex = -1;
                if (mv.shadowRoot) {
                    if (!mv.shadowRoot.getElementById('bars-no-outline')) {
                        const style = document.createElement('style');
                        style.id = 'bars-no-outline';
                        style.textContent = `
                            *, *:focus, *:focus-visible, *:active, canvas, .container, [part] {
                                outline: none !important;
                                border: none !important;
                                box-shadow: none !important;
                                -webkit-tap-highlight-color: transparent !important;
                            }
                            canvas {
                                outline: none !important;
                                border: none !important;
                                box-shadow: none !important;
                                -webkit-user-select: none !important;
                                user-select: none !important;
                            }
                        `;
                        mv.shadowRoot.appendChild(style);
                    }
                    const canvas = mv.shadowRoot.querySelector('canvas');
                    if (canvas) {
                        canvas.tabIndex = -1;
                        canvas.style.outline = 'none';
                        canvas.style.border = 'none';
                        canvas.style.boxShadow = 'none';
                    }
                }
            } catch (e) {}
        }

        window.setBars3D = function(visible, x, y, width, height, anim) {
            var mv = document.getElementById('bars-3d-model-viewer');
            if (!mv) return;
            if (!visible || width <= 0 || height <= 0) {
                mv.style.display = 'none';
                return;
            }
            mv.style.display = 'block';
            mv.style.left = x + 'px';
            mv.style.top = y + 'px';
            mv.style.width = width + 'px';
            mv.style.height = height + 'px';

            sanitizeModelViewer(mv);

            if (anim && anim !== '') {
                var targetAnim = resolveAnimation(anim);
                try {
                    if (mv.animationName !== targetAnim) {
                        mv.animationName = targetAnim;
                    }
                    if (mv.paused && mv.play) {
                        mv.play();
                    }
                } catch (e) {
                    console.warn("Failed to set animation:", e);
                }
            } else if (mv.paused && mv.play) {
                mv.play();
            }
        };

        window.hideBars3D = function() {
            var mv = document.getElementById('bars-3d-model-viewer');
            if (mv) mv.style.display = 'none';
        };

        var lastRobotClickTime = 0;
        function dispatchRobotClick() {
            var now = Date.now();
            if (now - lastRobotClickTime < 280) return;
            lastRobotClickTime = now;
            if (typeof window.onBarsRobotClick === 'function') {
                try {
                    window.onBarsRobotClick();
                } catch (e) {
                    console.warn("Robot click error:", e);
                }
            }
        }

        // Fallback between bars.glb and mike.glb on error
        var mvElem = document.getElementById('bars-3d-model-viewer');
        if (mvElem) {
            mvElem.addEventListener('load', function() {
                sanitizeModelViewer(mvElem);
                try {
                    var anim = resolveAnimation('wave');
                    mvElem.animationName = anim;
                    if (mvElem.play) mvElem.play();
                } catch (e) {}
            });

            mvElem.addEventListener('focus', function() {
                sanitizeModelViewer(mvElem);
                if (mvElem.blur) mvElem.blur();
            });

            mvElem.addEventListener('focusin', function() {
                sanitizeModelViewer(mvElem);
                if (mvElem.blur) mvElem.blur();
            });

            mvElem.addEventListener('error', function(e) {
                console.warn("Model loading error, trying fallback:", e);
                if (mvElem.getAttribute('src') === 'bars.glb') {
                    mvElem.setAttribute('src', 'mike.glb');
                }
            });

            mvElem.addEventListener('click', function(e) {
                dispatchRobotClick();
                sanitizeModelViewer(mvElem);
            });

            // Click handling with drag suppression
            var isDown = false;
            var startX = 0, startY = 0;

            mvElem.addEventListener('pointerdown', function(e) {
                isDown = true;
                startX = e.clientX;
                startY = e.clientY;
                sanitizeModelViewer(mvElem);
            });

            mvElem.addEventListener('pointerup', function(e) {
                if (!isDown) return;
                isDown = false;
                var dx = Math.abs(e.clientX - startX);
                var dy = Math.abs(e.clientY - startY);
                // If it's a tap/click (< 12px movement)
                if (dx < 12 && dy < 12) {
                    dispatchRobotClick();
                }
                sanitizeModelViewer(mvElem);
                if (mvElem.blur) mvElem.blur();
            });
        }
    </script>

    <script src="composeApp.js"></script>
</body>
</html>

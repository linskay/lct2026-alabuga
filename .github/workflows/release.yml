name: Build & Publish Release (APK + EXE)

# ──────────────────────────────────────────────────────────────────────────────
# Запускается при каждом пуше в main.
# 1. tag-release   — вычисляет следующий патч-тег (v0.1.X → v0.1.X+1),
#                    пушит его в репо, удаляет старые релизы (оставляет 5).
# 2. build-android / build-desktop-windows — собирают артефакты.
# 3. publish-release — создаёт GitHub Release с файлами.
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write   # нужно для создания тегов и управления релизами

jobs:
  # ──────────────────────────────────────────────────────────────────
  # JOB 1: авто-тег + очистка старых релизов
  # ──────────────────────────────────────────────────────────────────
  tag-release:
    name: 🏷️ Auto-tag & Cleanup
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # нужна полная история для чтения тегов

      - name: Bump patch version and push tag
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Берём последний семантический тег вида v<major>.<minor>.<patch>
          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [ -z "$LAST_TAG" ]; then
            # Тегов нет — стартуем с v0.1.0
            NEW_TAG="v0.1.0"
          else
            # Парсим компоненты
            MAJOR=$(echo "$LAST_TAG" | cut -d. -f1 | tr -d 'v')
            MINOR=$(echo "$LAST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LAST_TAG" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          echo "Last tag : ${LAST_TAG:-<none>}"
          echo "New tag  : ${NEW_TAG}"
          echo "new_tag=${NEW_TAG}" >> $GITHUB_OUTPUT

          # Создаём аннотированный тег и пушим
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Auto-release ${NEW_TAG}"
          git push origin "$NEW_TAG"

      - name: Delete old releases (keep latest 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Получаем список всех релизов, отсортированных по дате создания (новые сначала)
          RELEASES=$(gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName')

          echo "All releases:"
          echo "$RELEASES"

          # Пропускаем первые 5, остальные удаляем
          COUNT=0
          KEEP=5
          while IFS= read -r TAG; do
            COUNT=$((COUNT + 1))
            if [ "$COUNT" -gt "$KEEP" ]; then
              echo "🗑️  Deleting release + tag: ${TAG}"
              gh release delete "$TAG" --yes --cleanup-tag || true
            else
              echo "✅ Keeping release: ${TAG}"
            fi
          done <<< "$RELEASES"

  # ──────────────────────────────────────────────────────────────────
  # JOB 2: сборка Android APK
  # ──────────────────────────────────────────────────────────────────
  build-android:
    name: 🤖 Build Android APK
    needs: tag-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace \
            || ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arena-android-apk
          path: apk-dist/*.apk
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # JOB 3: сборка Windows Desktop
  # ──────────────────────────────────────────────────────────────────
  build-desktop-windows:
    name: 🪟 Build Windows Desktop EXE
    needs: tag-release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build Windows Executable & Distribution
        run: .\gradlew.bat :desktop:packageDistributionForCurrentOS :desktop:packageUberJarForCurrentOS --no-daemon --stacktrace

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin-dist
          Get-ChildItem -Path desktop\build\compose\binaries\main -Recurse -Include *.exe, *.msi | Copy-Item -Destination bin-dist\ -Force
          Get-ChildItem -Path desktop\build\compose\jars -Recurse -Include *.jar | Copy-Item -Destination bin-dist\ -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arena-windows-desktop
          path: bin-dist/*

  # ──────────────────────────────────────────────────────────────────
  # JOB 4: публикация релиза на GitHub
  # ──────────────────────────────────────────────────────────────────
  publish-release:
    name: 🚀 Publish GitHub Release
    needs: [tag-release, build-android, build-desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: arena-android-apk
          path: release-binaries/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: arena-windows-desktop
          path: release-binaries/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-release.outputs.new_tag }}
          name: "Арена Переговоров ОЭЗ «Алабуга» — ${{ needs.tag-release.outputs.new_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

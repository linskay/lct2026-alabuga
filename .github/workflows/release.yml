name: Build & Release (Android APK & Windows EXE)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. BUILD ANDROID APK
  # =========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-android-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Android Release APK
        run: |
          ./gradlew :composeApp:assembleRelease --stacktrace || ./gradlew assembleRelease --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build-artifacts
          find . -name "*.apk" -exec cp {} build-artifacts/BARS-Simulator-release.apk \;

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bars-android-apk
          path: build-artifacts/BARS-Simulator-release.apk

  # =========================================================================
  # 2. BUILD WINDOWS EXE (DESKTOP JVM COMPOSE)
  # =========================================================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-windows-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-windows-

      - name: Build Windows Desktop Distribution (.exe / installer)
        run: |
          ./gradlew :composeApp:packageDistributionForCurrentOS --stacktrace

      - name: Collect Windows Executables
        shell: bash
        run: |
          mkdir -p build-artifacts
          find composeApp/build/compose/binaries -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} build-artifacts/ \; || true
          ls -la build-artifacts/

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bars-windows-desktop
          path: build-artifacts/*

  # =========================================================================
  # 3. BUILD KOTLIN/WASM WEB ARTIFACTS
  # =========================================================================
  build-web:
    name: Build Kotlin Web (Wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Kotlin Wasm Browser Distribution
        run: |
          chmod +x gradlew || true
          ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace || true

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bars-web-wasm
          path: composeApp/build/dist/wasmJs/productionExecutable/
        continue-on-error: true

  # =========================================================================
  # 4. CREATE GITHUB RELEASE WITH DOWNLOADABLE APK AND EXE
  # =========================================================================
  create-release:
    name: Publish Release with APK and EXE
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: bars-android-apk
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: bars-windows-desktop
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: BARS Simulator Release ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 Релиз тренажера переговоров Б.А.Р.С. (Compose Multiplatform)
            
            ### 📦 Загрузки:
            - **Android APK**: `BARS-Simulator-release.apk` (поддержка Android 8.0+)
            - **Windows Desktop**: `*.exe` / `*.msi` (инсталлятор для Windows 10/11)
            
            ### ✨ Возможности:
            - Kotlin Multiplatform (Android + Desktop + Web Wasm)
            - Jetpack Compose Material 3 интерфейс
            - Модель искусственного интеллекта для жестких переговоров арендатора
            - Динамическая телеметрия (Доверие, Стресс, Готовность к сделке)
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

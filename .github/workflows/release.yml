name: Build & Publish Release (APK + EXE)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arena-android-apk
          path: app/build/outputs/apk/release/*.apk

  build-desktop-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build Windows Executable & Distribution
        run: .\gradlew.bat :desktop:packagePackageDistributionForCurrentOS :desktop:packageUberJarForCurrentOS --no-daemon --stacktrace
        continue-on-error: true

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin-dist
          Get-ChildItem -Path desktop\build\compose\binaries\main -Recurse -Include *.exe, *.msi | Copy-Item -Destination bin-dist\ -Force
          Get-ChildItem -Path desktop\build\compose\jars -Recurse -Include *.jar | Copy-Item -Destination bin-dist\ -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arena-windows-desktop
          path: bin-dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: arena-android-apk
          path: release-binaries/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: arena-windows-desktop
          path: release-binaries/

      - name: Set Release Tag
        id: vars
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_name=Релиз ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            DATE_STR=$(date +'%Y.%m.%d-%H%M')
            TAG_NAME="release-main-${DATE_STR}"
            echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "release_name=Сборка main (${DATE_STR}) [${SHORT_SHA}]" >> $GITHUB_OUTPUT
          fi

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Арена Переговоров ОЭЗ «Алабуга» — ${{ steps.vars.outputs.release_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
